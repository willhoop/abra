name: ingest
# Continually collect new ladder games as they are played.
#
# CADENCE — WHY SIX HOURS AND NOT ONE, AND NOT A DAY (2026-08-21, measured).
# Showdown's public replay pool is a ROLLING ~1,250 per format. Anything that ages out between
# pulls is gone: no later pull can reach it. Measured arrival rates on the two formats we collect:
#
#     ladder   ~1,100 games/day average, 1,660 peak   -> window fills in ~27 h average, ~18 h at peak
#     bo3        ~650 games/day average,   880 peak   -> window fills in ~46 h average, ~34 h at peak
#
# Ladder binds at ~18 hours. So DAILY IS NOT SAFE — 24 h at peak is ~1,660 games into a 1,250 slot
# and silently drops ~400. Hourly is 4% of capacity per run and pointless. Six hours is ~830 games
# at peak against 1,250: comfortable margin, and it survives a missed run.
on:
  schedule:
    - cron: '17 */6 * * *'     # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:           # allow a manual run from the Actions tab
permissions:
  contents: write              # so the job can commit the refreshed data back
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # THE STEP WHOSE ABSENCE KILLED THIS WORKFLOW FOR 24 DAYS.
      #
      # The plain .jsonl stores are GITIGNORED — git tracks `<store>.jsonl.gz` instead (acf7124,
      # 2026-07-28, because the plain ladder file was approaching GitHub's hard 100 MB per-file
      # limit). So a fresh runner has NO plain store. Without this step `durable-ingest.js` creates
      # a brand-new file holding only this run's fetch, and any commit of it would replace the whole
      # corpus with ~300 games.
      #
      # That is not hypothetical: it is exactly what the old `git add data/games.ladder.jsonl` would
      # have done had it succeeded. It failed instead — "paths are ignored by one of your .gitignore
      # files", exit 1 under `bash -e` — every hour for ~570 runs. THE BUG IS THE ONLY REASON THE
      # DATA SURVIVED. Restore first, and record the baseline every guard below compares against.
      - name: Restore the plain stores from the tracked .gz
        run: |
          set -eu
          for s in games.ladder games.bo3 games.ots; do
            if [ -f "data/$s.jsonl.gz" ]; then
              gunzip -c "data/$s.jsonl.gz" > "data/$s.jsonl"
              echo "$s restored: $(wc -l < "data/$s.jsonl") records"
            else
              echo "::error::data/$s.jsonl.gz is missing from the checkout — refusing to run"
              exit 1
            fi
          done
          wc -l < data/games.ladder.jsonl > "$RUNNER_TEMP/base-ladder"
          wc -l < data/games.bo3.jsonl    > "$RUNNER_TEMP/base-bo3"

      # THE RAW LOGS ARE THE ONLY SOURCE OF TRUTH; EVERYTHING ABOVE IS A DERIVED VIEW.
      #
      # Until 2026-09-04 they were gitignored, so the archive this whole "a new question is a
      # re-parse, never a re-pull" design rests on existed on ONE LAPTOP. Showdown's replay pool is
      # a rolling ~1,250 per format (see the cadence note at the top), so a log that is lost cannot
      # be re-fetched by anybody, ever. build/compress-stores.js now carries them as write-once
      # dated shards under data/raw/<store>/, which git tracks.
      #
      # Restoring them here does two jobs: the runner gets the real archive rather than a stub, and
      # it gives the shard guard below a BASELINE to compare against. Today the shard directories
      # are empty and this is a no-op that says so.
      - name: Restore the raw log archives from their tracked shards
        run: |
          set -eu
          node build/compress-stores.js --restore-raw
          for s in games.ladder games.bo3; do
            f="data/$s.raw-logs.jsonl"
            if [ -f "$f" ]; then wc -l < "$f" > "$RUNNER_TEMP/base-raw-$s"; else echo 0 > "$RUNNER_TEMP/base-raw-$s"; fi
            echo "$s raw archive: $(cat "$RUNNER_TEMP/base-raw-$s") logs"
          done

      # A collection job must never page the owner. Showdown can rate-limit, time out, or serve a
      # malformed log; none of that is a defect in this repo, and failing the run emailed a failure
      # notice every hour. These steps report their error and the run carries on.
      #
      # `id:` ALONGSIDE continue-on-error IS THE POINT. The step must not page the owner, but its
      # outcome must still be READABLE by a later step. durable-ingest.js now exits non-zero on a
      # zero-gain run it can PROVE was a broken endpoint rather than a quiet ladder, and the shrink
      # guard below is where that becomes loud. With continue-on-error the step's `conclusion` is
      # always success; `outcome` keeps the real result, and without an id nothing can ask for it.
      - name: Pull new replays (only appends games not already stored)
        id: pull_ladder
        continue-on-error: true
        run: PAGES=25 CONC=20 node engine/durable-ingest.js data/games.ladder.jsonl
      # THE BEST-OF-3 LADDER, INTO ITS OWN STORE. NEVER POOLED.
      #
      # gen9championsvgc2026regmbbo3 carries "Force Open Team Sheets" in its ruleset, so EVERY game
      # publishes all six sets of both sides. That makes it the only continuously-collected corpus in
      # which the CHOICE SET of a decision is known rather than guessed, which is exactly what
      # engine/fit_policy.js needs -- and it is our own scrape of our own ladder, unlike the external
      # archive the policy was first fitted on.
      #
      # The main format's ruleset says plain "Open Team Sheets", which is OPTIONAL -- both players
      # must agree -- which is why only ~1% of the closed store carries sheets.
      #
      # SEPARATE FILE, DELIBERATELY. Bo3 is a different information regime and a different metagame;
      # pooling it into games.ladder.jsonl would silently change every behavioural statistic in the
      # project. The format id comes from data/regulations.json, so a regulation rotation carries it.
      #
      # PAGES=25 on both, not 6: 6 pages is ~300 replays, which at a 6-hour cadence and ~1,100
      # games/day would under-reach the window on the ladder. 25 exhausts the public pool and
      # auto-stops when a page comes back empty, so it costs nothing when there is less to take.
      - name: Pull the Bo3 open-team-sheet ladder (separate store, never pooled)
        id: pull_bo3
        continue-on-error: true
        run: |
          BO3=$(node -e "const r=require('./data/regulations.json');process.stdout.write((r.regulations[r.active]||{}).bo3Format||'')")
          if [ -n "$BO3" ]; then
            PAGES=25 CONC=20 FORMATS="$BO3" node engine/durable-ingest.js data/games.bo3.jsonl
          else
            echo "no bo3Format for the active regulation; nothing to pull"
          fi

      # A STORE THAT SHRANK IS A BUG, NEVER AN UPDATE — AND IT IS THE ONLY FAILURE THIS PIPELINE
      # CANNOT UNDO. Every store here is append-only and deduped by id, so the record count is
      # monotonic by construction. If it ever falls, something upstream lost history (an empty
      # restore, a truncated fetch, a bad dedupe) and committing that would overwrite the good copy
      # on origin with the damaged one. Refuse, loudly, before anything is written.
      #
      # A ZERO-GAIN RUN IS ALSO CHECKED HERE, AND FOR THE SAME REASON. `get()` used to resolve the
      # empty string on an HTTP error, on a timeout AND on an empty body — three facts sharing one
      # value — so a dead replay API and a quiet hour both printed "appended 0 games" and exited 0.
      # The collector reported success for as long as it liked. durable-ingest.js now separates them
      # (the search offering ZERO ids cannot be a quiet ladder: the pool is a rolling ~1,250 per
      # format, so a live format always fills page one) and exits non-zero. The pull steps keep
      # continue-on-error so the run still commits whatever it did get; THIS step is what fails.
      - name: Refuse to proceed if a store shrank
        run: |
          set -eu
          fail=0
          for pair in "ladder:data/games.ladder.jsonl" "bo3:data/games.bo3.jsonl"; do
            k="${pair%%:*}"; f="${pair#*:}"
            was=$(cat "$RUNNER_TEMP/base-$k")
            now=$(wc -l < "$f")
            if [ "$now" -lt "$was" ]; then
              echo "::error::$f SHRANK: $was -> $now records. Refusing to commit."
              fail=1
            else
              echo "$k: $was -> $now (+$((now - was)))"
            fi
          done

          # THE RAW ARCHIVE IS THE SOURCE OF TRUTH, SO IT GETS THE SAME MONOTONICITY CLAIM.
          # It is append-only and deduped by id exactly as the parsed stores are, and it is now a
          # strict SUPERSET of them — durable-ingest.js archives the log of a game its parser cannot
          # read, which used to be deleted. A raw archive that lost logs is unrecoverable.
          for s in games.ladder games.bo3; do
            f="data/$s.raw-logs.jsonl"
            was=$(cat "$RUNNER_TEMP/base-raw-$s")
            now=0; [ -f "$f" ] && now=$(wc -l < "$f")
            if [ "$now" -lt "$was" ]; then
              echo "::error::$f SHRANK: $was -> $now logs. The raw archive cannot be re-fetched. Refusing."
              fail=1
            else
              echo "$s raw: $was -> $now (+$((now - was)))"
            fi
          done

          # THE PULL STEPS' REAL OUTCOME. continue-on-error hides it from the run's conclusion; it
          # must not hide it from a human. A non-zero exit here means durable-ingest.js PROVED the
          # endpoint was broken — not that it found nothing.
          for o in "ladder:${{ steps.pull_ladder.outcome }}" "bo3:${{ steps.pull_bo3.outcome }}"; do
            k="${o%%:*}"; v="${o#*:}"
            if [ "$v" = "failure" ]; then
              echo "::error::the $k pull reported a BROKEN ENDPOINT (durable-ingest.js exited non-zero)."
              echo "::error::this is not a quiet ladder — read that step's 'ZERO-GAIN' line for which endpoint failed."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      # THE NEXT REGULATION, COLLECTED FROM THE HOUR IT SHIPS.
      #
      # The replay pool is a ROLLING window (see the cadence note at the top of this file), so the
      # opening days of a new regulation are NOT recoverable later. "We will point the collector at
      # it when it lands" silently costs the start of the metagame.
      #
      # This step collects nothing today and SAYS SO — engine/next_regulation.js derives the format
      # set from the live server's format list and the local dex at run time and compares it against
      # data/regulations.json. No format id is hardcoded anywhere in it, so the day Showdown ships
      # the next Champions VGC regulation this step starts collecting on the next scheduled run with
      # nobody editing anything.
      #
      # IT CANNOT DISTURB THE THREE TRACKED STORES. It writes data/games.<formatid>.jsonl — the file
      # name IS the format id — and skips every format data/regulations.json already knows about, so
      # games.ladder.jsonl, games.bo3.jsonl and games.ots.jsonl are unreachable from it. It also
      # never edits data/regulations.json: flipping `active` re-points the LADDER collector, which
      # is the one edit that could stop the existing corpus growing. It prints the block to paste.
      - name: Collect the next Champions regulation, if Showdown has shipped it
        continue-on-error: true
        run: PAGES=25 CONC=20 node engine/next_regulation_ingest.js

      - name: Rebuild the meta model
        continue-on-error: true
        run: node engine/analyze.js data/games.ladder.jsonl
      # The site's headline counts were regenerated by hand, so "1,838 clean games" was a number
      # that aged every hour while the store grew underneath it. Nothing on the page may be typed
      # (S13), and "derived once, months ago" is a hardcode with extra steps. This recounts from
      # the tracked store every run, so the clean-game count on the site is the clean-game count.
      #
      # The raw protocol logs are gitignored (~1GB), so this runner cannot recompute the two
      # log-derived figures; refresh-site-data.py carries those forward rather than zeroing them.
      # THE DERIVED PRIORS MUST TRACK THE META, NOT THE DAY THEY WERE LAST RUN BY HAND.
      # Both read the store through the clean filter, so they never learn from bot games.
      #
      # BUT THIS JOB MAY NOT WRITE data/move-priors.json — IT IS A FROZEN ENGINE SOURCE.
      # (2026-08-22; docs/_reports/2026-08-22-ingest-invalidates-releases.md.)
      # engine/engine_release.js freezes 26 files as the engine, and move-priors is one of them,
      # correctly: engine/set_priors.js movePriors() -> sampleMoves() is called from
      # engine/champions_sim.js packTeam() and decides which moves an unrevealed set is filled with,
      # on the team the SHOWDOWN REFERENCE ENGINE plays. A different pool is a different team is a
      # different battle. The release id is the digest of those 26 digests, so every write here
      # minted a NEW ENGINE and withheld every artifact measured before it — a six-hourly job forcing
      # a re-run of a twelve-hour measurement chain. It cost two measurements in four hours on
      # 2026-08-22 (a roster re-measurement of 157 -> 5, and a same-seed differential that walked a
      # different sample: skipped_multihit 170 against 154).
      #
      # So this step keeps COLLECTING and stops DECIDING. It writes the observed table; the engine's
      # copy moves only when a person runs `node engine/policy.js --promote`, which prints what would
      # change. That is the pattern data/residual-order.json and data/switchin-order.json already use
      # — derived tables inside SOURCES, regenerated by an explicit --write, never by a cron.
      # SOURCES is untouched and no existing release changes meaning.
      - name: Re-derive the behaviour priors from the current clean store
        continue-on-error: true
        run: |
          node engine/policy.js data/games.ladder.jsonl data/move-priors.observed.json
          node engine/bring_priors.js
      # Two things that must happen on a CONDITION nobody is watching for: re-run the CHOMP proof
      # once the clean corpus can actually resolve it, and shout if the regulation rotates.
      - name: Conditional triggers (CHOMP power, regulation rotation)
        continue-on-error: true
        run: node build/triggers.js --fire
      - name: Re-derive the figures in ORIENTATION.md
        continue-on-error: true
        run: node build/sync_orientation.js
      - name: Recount the site's clean-game stats
        continue-on-error: true
        run: python3 engine/refresh-site-data.py

      - name: Commit if the store or model changed
        run: |
          git config user.name  "abra-bot"
          git config user.email "abra-bot@users.noreply.github.com"

          # COMMIT THE .gz, NOT THE PLAIN FILE. The plain .jsonl is gitignored; naming it here is
          # what broke this workflow for 24 days. build/compress-stores.js writes the .gz that git
          # actually tracks, and `--check` exits 1 if one lags its store.
          node build/compress-stores.js

          # AND SHARD THIS RUN'S NEW RAW LOGS. One small gzip per run under data/raw/<store>/,
          # never a single archive-wide .gz: the raw logs compress to ~14%, so one blob is ~78 MB
          # today against GitHub's HARD 100 MB per-file limit, and gzip cannot append — it would be
          # rewritten whole every six hours and add hundreds of MB of pack growth a day. Shards are
          # write-once: never rewritten, never compacted.
          node build/compress-stores.js --raw

          # ADD ONLY WHAT EXISTS, AND SAY SO WHEN SOMETHING DOES NOT.
          # `git add` on a pathspec that matches nothing exits 1, this block runs under `bash -e`,
          # and the commit then never happens — silently, because every derivation step above is
          # continue-on-error and has already "succeeded". That is precisely how the old
          # `git add data/games.ladder.jsonl` killed this workflow for 24 days ("paths are ignored
          # by one of your .gitignore files"). A new path in this list is the same hazard, so the
          # list is walked and a missing entry is a loud ::warning:: instead of a dead run.
          add_artifacts() {
            for f in data/games.ladder.jsonl.gz data/games.bo3.jsonl.gz data/games.ots.jsonl.gz \
                     data/meta-usage.json data/live.js data/move-priors.observed.json \
                     data/bring-priors.json data/chomp-ev.json docs/ORIENTATION.md \
                     data/next-regulation.json; do
              if [ -e "$f" ]; then
                git add "$f"
              else
                echo "::warning::$f was not produced this run; it is not in this commit"
              fi
            done
            # THE NEXT-REGULATION STORES, WHOSE NAMES DO NOT EXIST YET.
            # One .gz per Showdown format id, written by engine/next_regulation_ingest.js, so they
            # cannot be listed above — the id is not known until Showdown ships the format. The
            # glob matches nothing today; an unmatched glob leaves `$f` as the literal pattern,
            # which `-e` rejects, so this is a no-op rather than the `bash -e` abort that killed
            # this workflow for 24 days. It is deliberately NOT a ::warning:: when empty: absent is
            # the correct state until the regulation rotates.
            for f in data/games.gen9champions*.jsonl.gz; do
              if [ -e "$f" ]; then
                git add "$f"
                echo "next-regulation store committed: $f ($(wc -c < "$f") bytes)"
              fi
            done
            # THE RAW LOG SHARDS, WHOSE NAMES ARE TIMESTAMPS AND SO CANNOT BE LISTED EITHER.
            # Same unmatched-glob discipline as the block above: an empty glob leaves `$f` as the
            # literal pattern, `-e` rejects it, and this is a no-op rather than the `bash -e` abort
            # that killed this workflow for 24 days. Absent is the correct state before the first
            # shard is cut. Shards are write-once, so this only ever ADDS files.
            for f in data/raw/*/*.jsonl.gz; do
              if [ -e "$f" ]; then
                git add "$f"
                echo "raw log shard committed: $f ($(wc -c < "$f") bytes)"
              fi
            done
          }
          # NOTE WHAT IS NOT HERE: data/move-priors.json. It is a frozen engine source and this job
          # must never write or commit it — see the derivation step above. The observed table is
          # what ships; `node engine/policy.js --promote` is what lands it on the engine.
          add_artifacts
          if git diff --cached --quiet; then
            echo "no new games this run"; exit 0
          fi
          git commit -m "ingest: new ladder games $(date -u +%Y-%m-%dT%H:%MZ)"

          # Manual pushes move origin between runs, so a plain push is rejected (non-fast-forward).
          #
          # This used to rely on `.gitattributes` marking the stores `merge=union` so appends never
          # conflicted. That driver was REMOVED on 2026-07-24: it concatenates both sides of a
          # conflicting hunk, which on an append-only log replays the whole appended block and
          # duplicated the store four times. It applied to rebase as well as merge, so switching to
          # --rebase did not stop it. Do not reintroduce it.
          #
          # Instead reconcile explicitly, which is deterministic and cannot double anything: take
          # origin's store, append ours, dedupe by id (idempotent, keeps the first occurrence), and
          # commit that on top of origin. The result always fast-forwards, so there is no merge at
          # all and no driver is involved.
          #
          # NOTE THE .gz ROUND-TRIP. `git reset --hard origin/main` restores origin's COMPRESSED
          # store and deletes nothing else, so ours must be saved as plain text first, origin's
          # decompressed, ours appended, the result deduped and recompressed. Skipping the
          # decompress would append our text to origin's stale copy and lose everything between.
          for i in 1 2 3; do
            git fetch origin main || { echo "fetch failed"; sleep 5; continue; }
            cp data/games.ladder.jsonl "$RUNNER_TEMP/ours.jsonl"
            cp data/games.bo3.jsonl    "$RUNNER_TEMP/ours-bo3.jsonl" 2>/dev/null || true
            git reset --hard origin/main
            gunzip -c data/games.ladder.jsonl.gz > data/games.ladder.jsonl
            gunzip -c data/games.bo3.jsonl.gz    > data/games.bo3.jsonl
            gunzip -c data/games.ots.jsonl.gz    > data/games.ots.jsonl || true
            cat "$RUNNER_TEMP/ours.jsonl" >> data/games.ladder.jsonl
            # `|| true` is load-bearing: GitHub runs this block under `bash -e`, so a bare
            # `[ -f x ] && cat x` returns 1 on the very first run (when the file does not exist yet)
            # and would abort the step BEFORE the push, silently losing the whole run's ingest.
            if [ -f "$RUNNER_TEMP/ours-bo3.jsonl" ]; then cat "$RUNNER_TEMP/ours-bo3.jsonl" >> data/games.bo3.jsonl; fi || true
            python3 engine/dedupe_store.py --write || true
            python3 engine/dedupe_store.py data/games.bo3.jsonl --write || true

            # THE SHRINK GUARD AGAIN, ON THE RECONCILED RESULT. The append-and-dedupe above is the
            # step that could silently lose history in a push race, so it is checked on its own
            # output rather than trusted because the earlier check passed.
            for pair in "ladder:data/games.ladder.jsonl" "bo3:data/games.bo3.jsonl"; do
              k="${pair%%:*}"; f="${pair#*:}"
              if [ "$(wc -l < "$f")" -lt "$(cat "$RUNNER_TEMP/base-$k")" ]; then
                echo "::error::$f shrank during reconcile — refusing to push"; exit 1
              fi
            done

            # THE NEXT-REGULATION STORES GET THE SAME RECONCILE, FOR THE SAME REASON.
            # `git reset --hard origin/main` above restored ORIGIN'S .gz and left the gitignored
            # plain .jsonl alone, so recompressing the plain file here would publish our copy over
            # origin's and lose whatever another run pushed in between. --reconcile is the same
            # union-and-dedupe-by-id the ladder gets four lines up: origin's rows first, ours
            # appended, first occurrence wins. It refuses to write a store smaller than it found.
            # No network, and a no-op when no such store exists.
            node engine/next_regulation_ingest.js --reconcile || true

            node engine/analyze.js data/games.ladder.jsonl || true
            # the OBSERVED table again, never the frozen engine source — see the derivation step
            node engine/policy.js data/games.ladder.jsonl data/move-priors.observed.json || true
            node engine/bring_priors.js || true
            node build/triggers.js --fire || true
            node build/sync_orientation.js || true
            python3 engine/refresh-site-data.py || true
            node build/compress-stores.js
            # RE-SHARD INSIDE THE RETRY LOOP, NOT ONLY BEFORE IT. `git reset --hard origin/main`
            # above restores ORIGIN'S tracked files, which now includes data/raw/ — so the shard
            # staged before the loop is gone and origin's shard set is what is on disk. The plain
            # raw archive is gitignored and survives the reset untouched, and --raw recomputes
            # "rows not already in a shard" against whatever shards origin actually has. That makes
            # this self-healing in a push race rather than a lost shard, and it cannot duplicate:
            # the id set is rebuilt from the shards on disk every time.
            node build/compress-stores.js --raw
            add_artifacts
            if git diff --cached --quiet; then
              echo "origin already has everything from this run"; exit 0
            fi
            git commit -m "ingest: new ladder games $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main && exit 0
            echo "push attempt $i failed; retrying"; sleep 5
          done
          echo "::error::ingest could not push after 3 attempts"
          exit 1   # a push that never lands is a SILENT DATA LOSS, not a transient — fail loudly
