<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABRA WORLD — the Champions modeling town</title>
<style>
/* ============ ABRA WORLD — Club-Penguin-meets-Pokemon ============ */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap');
:root{
  --sky1:#8fd3ff; --sky2:#c9efff; --snow:#f4fbff; --ink:#20344a;
  --line:#20344a;
  --electric:#ffd23f; --electric2:#ffb300;
  --fight:#ff6b57; --psy:#ff6bd6; --water:#4fb0ff; --grass:#5fd07a; --dragon:#7a6bff;
  --card:#ffffff; --shadow:rgba(32,52,74,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
body{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,var(--snow) 42%,var(--snow) 100%);min-height:100vh}
h1,h2,h3,.baloo{font-family:'Baloo 2',cursive}
button{font-family:'Baloo 2',cursive;cursor:pointer}

/* ---- sky layer ---- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:50%;filter:blur(.3px);opacity:.9;
  box-shadow:40px 8px 0 6px #fff,90px 0 0 0px #fff,-38px 10px 0 0 #fff;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.snowf{position:absolute;top:-10px;color:#fff;opacity:.9;animation:fall linear infinite;text-shadow:0 1px 2px rgba(0,0,0,.05)}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
.mountain{position:fixed;bottom:calc(58vh - 2px);left:0;right:0;height:120px;z-index:0;pointer-events:none}

/* ---- header / tabs ---- */
header{position:relative;z-index:5;text-align:center;padding:18px 12px 6px}
.logo{display:inline-flex;align-items:center;gap:14px}
.logo h1{margin:0;font-size:clamp(34px,7vw,68px);color:#fff;letter-spacing:1px;
  text-shadow:0 4px 0 var(--electric2),0 6px 0 var(--line),0 10px 18px var(--shadow);animation:bob 3s ease-in-out infinite}
.logo img{width:74px;height:74px;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.tagline{color:#25405a;font-weight:600;margin:4px 0 0;font-size:15px;text-shadow:0 1px 0 #fff}

/* The tab row was capped at 1000px with tabs sized for six of them. At nine it wrapped and left a
   single orphaned tab centred on its own line, which read as a mistake. Wider cap plus slightly
   tighter tabs so the row fits on a normal screen and wraps evenly rather than 8-and-1. */
nav{position:relative;z-index:6;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:8px 10px 4px;max-width:1180px;margin:0 auto}
.tab{border:3px solid var(--line);background:#fff;border-radius:14px;padding:6px 11px;font-size:14px;font-weight:700;
  color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .15s;display:flex;align-items:center;gap:6px}
.tab img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}
.tab svg{width:22px;height:22px;flex:none;display:block}
.house .plat svg{width:56px;height:56px;display:block;margin:0 auto}
.hero .mascotsvg{width:104px;height:104px;flex:none;display:flex;align-items:center;justify-content:center}
.hero .mascotsvg svg{width:92px;height:92px;stroke-width:1.6}
.tab:hover{transform:translateY(-2px);background:#fff7d6}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tab.on{background:var(--electric);box-shadow:0 4px 0 var(--electric2);transform:translateY(-1px)}

/* ---- stage / rooms ---- */
main{position:relative;z-index:5;max-width:1040px;margin:10px auto 60px;padding:0 14px}
.room{display:none;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.room.on{display:block}
@keyframes pop{from{transform:scale(.96) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.panel{background:var(--card);border:4px solid var(--line);border-radius:26px;box-shadow:0 10px 0 var(--shadow);padding:22px;margin-bottom:18px}
.panel h2{margin:0 0 4px;font-size:30px;display:flex;align-items:center;gap:12px}
.panel .sub{color:#5a708a;font-weight:600;margin:0 0 14px}
.mascot{width:104px;height:104px;object-fit:contain;image-rendering:pixelated;animation:bob 2.2s ease-in-out infinite;flex:none;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.14))}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:16px;padding:13px 18px;font-weight:600;box-shadow:0 4px 0 var(--shadow);flex:1;min-width:240px;max-width:860px;font-size:16px;line-height:1.45}
/* NOT text-wrap:balance. Balance equalises line LENGTHS, so a short sentence in a wide bubble gets
   broken into two stubby even lines instead of filling the row — the box looked wide while the text
   wrapped at half of it. Normal wrapping fills the line, which is what a speech bubble wants. */
.bubble:before{content:'';position:absolute;left:-14px;top:22px;border:8px solid transparent;border-right-color:var(--line)}
.bubble:after{content:'';position:absolute;left:-9px;top:22px;border:8px solid transparent;border-right-color:#fff}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero > div{flex:1;min-width:260px}
.panel h2{margin-top:0}
/* Chips carry every caveat on this site: "suggestive, not proven", "1,124 usable of 8,757",
   "never mixed with real games", plus KING's entire equilibrium output. They were set to
   display:none, so the whole honesty layer was written and then invisibly deleted -- a review
   marked "site never showed the usable count" as FIXED while the CSS was removing the fix.
   If a claim needs a caveat, the caveat ships with it. */
/* The hand-written battle-field CSS lived here. Deleted with the viewer it styled:
   the replay is now rendered by Showdown's own player in an iframe (web/replay.html),
   which brings its own styling, animations and running log. */
.chip{display:inline-block;background:#eef4ff;border:2px solid var(--line);border-radius:999px;
      padding:3px 10px;margin:3px 4px 0 0;font-size:12px;font-weight:800;color:#3a5372;
      vertical-align:middle}
.chip.warn{background:#fff4e5;border-color:#f0c48a;color:#8a5a1a}
.chip.null{background:#ffecec;border-color:#f0a8a8;color:#9a2b2b}
.chip.ok{background:#e9f8ee;border-color:#9ad9b0;color:#1a6b38}
.speedbar{height:12px;border-radius:8px;background:#e7eefc;border:2px solid var(--line);overflow:hidden;margin-top:6px}
.speedbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--electric),var(--electric2))}

/* ---- town map ---- */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.house{position:relative;border:4px solid var(--line);border-radius:22px;padding:36px 12px 16px;text-align:center;background:#fff;
  box-shadow:0 7px 0 var(--shadow);cursor:pointer;overflow:hidden;transition:transform .14s cubic-bezier(.3,1.5,.4,1),box-shadow .14s}
.house:hover{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 13px 0 var(--shadow)}
.house:hover img{animation:hop .5s ease-in-out infinite}
.house:active{transform:translateY(2px);box-shadow:0 3px 0 var(--shadow)}
.house .roof{position:absolute;inset:-4px -4px auto -4px;height:30px;border-radius:18px 18px 50% 50%/18px 18px 26px 26px;border-bottom:3px solid var(--line)}
.house .tint{position:absolute;left:0;right:0;top:26px;bottom:0;opacity:.13;z-index:0}
.house .plat{position:relative;z-index:1;margin-top:2px}
.house .plat:after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:82px;height:15px;
  background:#e3f1ff;border:2px solid var(--line);border-radius:50%;z-index:-1}
.house img{width:82px;height:82px;object-fit:contain;image-rendering:pixelated;animation:bob 2.6s ease-in-out infinite;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.14))}
.house b{position:relative;z-index:1;display:block;margin-top:10px;font-size:17px}
.house small{position:relative;z-index:1;color:#6a7f97;font-weight:600;font-size:12px}
@keyframes hop{50%{transform:translateY(-11px) scale(1.06)}}
/* ---- per-room floating mascot advisor, each with its own personality ---- */
.advisor{position:fixed;z-index:36;width:78px;height:78px;pointer-events:auto;opacity:.9}
.advisor .tip{pointer-events:none}
.advisor .anim{width:100%;height:100%;display:block;cursor:help}
.advisor img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 3px 4px rgba(0,0,0,.16))}
.advisor .tip{position:absolute;bottom:70px;right:2px;min-width:152px;max-width:236px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 11px;font-size:12.5px;font-weight:600;color:#2a3b52;box-shadow:0 4px 0 var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
.advisor .tip.show{opacity:1;transform:none}
.advisor .tip:after{content:"";position:absolute;bottom:-10px;right:22px;border:7px solid transparent;border-top-color:#fff}
/* JOLTEON — twitchy, electric, fast */
@keyframes p-zap{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-4px) rotate(-4deg)}40%{transform:translateY(-2px) rotate(3deg)}60%{transform:translateY(-6px) scale(1.06)}80%{transform:translateY(-1px) rotate(-2deg)}}
.p-jolteon{animation:p-zap .5s steps(5,end) infinite}
/* MEDICHAM — disciplined, still, then a sharp strike */
@keyframes p-punch{0%,55%,100%{transform:translate(0,0) scale(1)}64%{transform:translate(-6px,-2px) scale(1.05)}72%{transform:translate(6px,0) scale(1.05)}80%{transform:translate(0,0)}}
.p-medicham{animation:p-punch 2.6s ease-in-out infinite}
/* DITTO — squishy, gooey, playful */
@keyframes p-wobble{0%,100%{transform:scale(1,1)}30%{transform:scale(1.1,.9)}60%{transform:scale(.92,1.08) rotate(3deg)}}
.p-ditto{animation:p-wobble 1.5s ease-in-out infinite}
/* KADABRA — hovering, aloof, psychic drift */
@keyframes p-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-11px) rotate(3deg)}}
.p-kadabra{animation:p-float 3.6s ease-in-out infinite}
/* SLOWKING — regal, unhurried sway */
@keyframes p-sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
.p-slowking{animation:p-sway 5s ease-in-out infinite}
/* CHOMP — coiled, then lunges */
@keyframes p-lunge{0%,68%,100%{transform:translateX(0) scale(1)}78%{transform:translateX(-12px) scale(1.08)}86%{transform:translateX(3px) scale(1.02)}}
.p-chomp{animation:p-lunge 2.1s cubic-bezier(.5,0,.3,1) infinite}
/* ABRA (town) — sleepy bob */
@keyframes p-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.p-town{animation:p-drift 2.9s ease-in-out infinite}
@media(max-width:1180px){.advisor{display:none}}

/* ---- JOLTEON battle booth ---- */
.booth{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.booth.two{grid-template-columns:1fr 1fr}
@media(max-width:760px){.booth{grid-template-columns:1fr}}
.side{border:3px dashed var(--line);border-radius:18px;padding:12px;background:#f7fbff}
.side.you{background:#f2fff5}.side.rival{background:#fff2f6}
.side h3{margin:0 0 8px;font-size:20px;text-align:center}
.slots{display:flex;gap:6px;justify-content:center;min-height:60px;flex-wrap:wrap}
.slot{position:relative;width:52px;height:52px;border:2px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.slot img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.slotx{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#ff6b6b;color:#fff;font-weight:800;font-size:12px;line-height:1;display:none;cursor:pointer;padding:0;align-items:center;justify-content:center}
.slot:hover .slotx{display:flex}
.clearx{align-self:center;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:12px;padding:3px 9px;cursor:pointer;margin-left:2px}
.clearx:hover{background:#ffe0e0}
.pksearch{width:100%;border:3px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;margin:10px 0 6px;font-family:'Fredoka',sans-serif}
.picker{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px;max-height:420px;overflow-y:auto;overflow-x:hidden;padding:6px;
  border:2px dashed #b9cfe6;border-radius:12px;background:#fbfdff;scrollbar-gutter:stable}
.pk{width:54px;height:54px;border:2px solid var(--line);border-radius:11px;background:#fff;padding:0;position:relative;transition:transform .08s}
.pk img{width:50px;height:50px;object-fit:contain;image-rendering:pixelated}
.pk:hover{transform:scale(1.07);background:#fff7d6;z-index:2}
.pk.sel{background:var(--electric);box-shadow:0 0 0 2px var(--electric2)}
.vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:120px}
.vsbadge{font-family:'Baloo 2';font-size:34px;color:#fff;background:var(--fight);border:3px solid var(--line);border-radius:50%;
  width:66px;height:66px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--shadow);animation:bob 2s ease-in-out infinite}
.battlebtn{border:3px solid var(--line);background:var(--electric);color:var(--ink);font-size:20px;padding:10px 22px;border-radius:16px;box-shadow:0 5px 0 var(--electric2)}
.battlebtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--electric2)}
.meterwrap{margin-top:16px;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;height:44px;position:relative;display:flex}
.mYou{background:linear-gradient(90deg,#5fd07a,#39b85f);width:50%;transition:width 1s cubic-bezier(.3,1.2,.4,1)}
.mRiv{background:linear-gradient(90deg,#ff9bbb,#ff6b8f);flex:1;transition:width 1s}
.meterwrap b{position:absolute;top:50%;transform:translateY(-50%);font-family:'Baloo 2';color:#fff;font-size:18px;text-shadow:0 2px 0 var(--shadow)}
.readout{margin-top:12px;text-align:center;font-weight:600;color:#3a5372;min-height:24px}
.zap{display:inline-block;width:12px;height:16px;vertical-align:-3px;background:#ffd23f;
  clip-path:polygon(48% 0,100% 0,58% 42%,92% 42%,18% 100%,44% 55%,4% 55%);
  filter:drop-shadow(0 0 3px #ffd23f);animation:zapflash .7s steps(2,jump-none) infinite}
@keyframes zapflash{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}
.pastebox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:680px){.pastebox{grid-template-columns:1fr}}
.pastecol label{font-weight:700;font-size:13px;display:block;margin-bottom:4px}
.pastecol textarea{width:100%;height:88px;border:3px solid var(--line);border-radius:12px;padding:8px;font-family:'Fredoka',system-ui,sans-serif;font-size:12px;resize:vertical;background:#fff}
.savedwrap{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.savedhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.savedbar{display:flex;gap:10px;flex-wrap:wrap}
.savedteam{border:2px solid var(--line);border-radius:12px;padding:6px 6px 4px;background:#f7fbff}
.savedteam .m{display:flex;gap:1px}
.savedteam img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}
.savedteam .b{display:flex;gap:4px;margin-top:4px;justify-content:center}
.savedteam .b button{border:2px solid var(--line);background:#fff;border-radius:7px;font-size:12px;font-weight:700;padding:2px 8px;cursor:pointer}
.savedteam .b button:hover{background:#fff7d6}
.mcbox{width:100%;height:68px;border:3px solid var(--line);border-radius:12px;padding:8px;font-family:'Fredoka',system-ui,sans-serif;font-size:12px;resize:vertical;margin-top:4px}
.minibtn{border:2px solid var(--line);background:var(--electric);border-radius:9px;padding:2px 8px;font-size:12px;font-weight:700;box-shadow:0 2px 0 var(--electric2)}
.minibtn:active{transform:translateY(2px);box-shadow:none}

/* ---- info blocks ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:#eaf6ff;border:3px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:92px;min-width:0}
.stat b{display:block;font-family:'Baloo 2';font-size:clamp(22px,4.4vw,32px);color:var(--electric2);line-height:1;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stat span{font-weight:600;font-size:13px;color:#4a6a8a;line-height:1.25}
.tier{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0;background:#fff}
.tier img{width:56px;height:56px;image-rendering:pixelated;flex:none}
.tier .g{flex:1}
.tier .cost{font-family:'Baloo 2';font-size:13px;padding:3px 8px;border-radius:999px;border:2px solid var(--line);white-space:nowrap}
.link{display:inline-block;margin:4px 6px 0 0;border:3px solid var(--line);background:#fff;border-radius:14px;padding:7px 12px;font-weight:700;color:var(--ink);text-decoration:none;box-shadow:0 4px 0 var(--shadow)}
.link:hover{background:#fff7d6;transform:translateY(-2px)}
.tag2{font-size:12px;background:#ffe08a;border:2px solid var(--line);border-radius:8px;padding:1px 7px;font-weight:700}
/* ---- KADABRA battle scenes ---- */
.stage{position:relative;border:3px solid var(--line);border-radius:16px;overflow:hidden;height:220px;
  background:linear-gradient(#bfe3ff 0%,#dff1ff 54%,#c7ebac 54%,#9ed17f 100%);margin:8px 0}
.stage .side{position:absolute;display:flex;gap:16px}
.stage .foe{top:14px;right:22px}
.stage .you{bottom:8px;left:22px}
.bmon{width:96px;text-align:center;animation:bob 2.8s ease-in-out infinite}
.bmon img{width:82px;height:82px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
.bmon.faint{opacity:.35;filter:grayscale(1)}
.bmon .nm{font-family:'Baloo 2';font-size:12px;font-weight:700;background:#ffffffd8;border:2px solid var(--line);border-radius:7px;padding:0 6px;display:inline-block}
.hpbar{height:8px;border:2px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;margin:3px auto;width:74px}
.hpbar>i{display:block;height:100%;transition:width .6s cubic-bezier(.3,1.2,.4,1)}
.statuschip{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 3px;background:#ffd23f;font-weight:700;text-transform:uppercase}
.kadlogline{font-weight:600;color:#4a6a8a;font-size:13px;margin:3px 0}
.kadpop{display:flex;gap:12px;align-items:flex-start;margin-top:10px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.kadpop img{width:74px;height:74px;object-fit:contain;image-rendering:pixelated;animation:bob 2s ease-in-out infinite;flex:none}
.kadpop .bubble{flex:1;border-width:3px}
.kadstep{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px}
.kadstep button{border:3px solid var(--line);background:var(--electric);border-radius:12px;padding:6px 16px;font-weight:800;box-shadow:0 3px 0 var(--electric2)}
.kadstep button:active{transform:translateY(2px);box-shadow:none}
.kdot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;display:inline-block}
.kdot.on{background:var(--electric)}
#threattable{max-height:440px;overflow:auto;border:3px solid var(--line);border-radius:14px;margin-top:8px}
.ttab{width:100%;border-collapse:collapse;font-size:13px}
.ttab th{position:sticky;top:0;background:#1E2761;color:#fff;padding:7px 8px;cursor:pointer;font-family:'Baloo 2',sans-serif;font-size:12px;white-space:nowrap}
.ttab th.on{background:#3550b0}
.ttab th:hover{background:#33449c}
.ttab .tnh{text-align:left}
.ttab td{border-bottom:1px solid #e6ecf7;padding:4px 8px;text-align:center}
.ttab td.rk{color:#8aa;font-weight:700;width:26px}
.ttab .tn{text-align:left;font-weight:700}
.ttab .tn img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:6px}
.ttab tbody tr:hover td{background:#f2f6ff}
footer{position:relative;z-index:5;text-align:center;color:#3a5372;font-weight:600;padding:0 0 30px}
canvas#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
.walker{position:fixed;bottom:10px;z-index:4;width:60px;height:60px;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.tp{position:fixed;z-index:1;width:52px;height:52px;object-fit:contain;image-rendering:pixelated;pointer-events:none;opacity:0;
  transition:opacity .45s ease, transform .45s cubic-bezier(.3,1.4,.4,1);filter:drop-shadow(0 0 7px #ffe680)}
.tp.in{opacity:.85;transform:scale(1) rotate(0)}
.tp.out{opacity:0;transform:scale(.15) rotate(25deg)}
.tp.shiny{filter:drop-shadow(0 0 7px #ffe680) drop-shadow(0 0 16px #ffd23f);animation:shinyPulse 2.2s ease-in-out infinite;}

function pwin(A,B){ // A,B arrays of species names -> P(A beats B), the real JOLTEON logistic
  let s=0; A.forEach(n=>s+=(BY[n]?.w||0)); B.forEach(n=>s-=(BY[n]?.w||0));
  s+=JOLT.wSpeed*(mean(A.map(n=>BY[n]?.spd??0.5))-mean(B.map(n=>BY[n]?.spd??0.5)));
  s+=JOLT.wFire *(mean(A.map(n=>BY[n]?.fire??0.5))-mean(B.map(n=>BY[n]?.fire??0.5)));
  s+=0.55*typeEdge(A,B);   // team-vs-team type coverage — the missing matchup signal
  return 1/(1+Math.exp(-s));
}

/* STATUS BADGE, RENDERED FROM data/status.js — never typed into a room.
   S13: a file nobody generates is a file that will lie. build/build_status.js derives each model's
   status from its evaluation artifact, so a new result relabels the room on the next build with
   nobody editing this page. `derived:false` is shown differently on purpose — "measured as null"
   and "nobody has measured it" are different claims, and conflating them is how a roadmap item
   starts looking like a result. */
const STATUS_LOOK={
  live:      ['ok',  'collecting'],
  validated: ['ok',  'validated against an independent oracle'],
  win:       ['ok',  'beats its baseline'],
  built:     ['',    'built'],
  dev:       ['warn','in progress'],
  roadmap:   ['warn','not built yet'],
  pivot:     ['warn','being reworked'],
  null:      ['null','tested — no better than a coin'],
  retired:   ['null','retired to the PC'],
};
function statusFor(id){
  const S=(window.ABRA_STATUS&&window.ABRA_STATUS.models)||[];
  return S.find(m=>m.id===id)||null;
}
function statusBadge(id){
  const m=statusFor(id); if(!m) return '';
  const [cls,label]=STATUS_LOOK[m.status]||['',m.status];
  const measured=m.derived?'measured':'not yet measured';
  const tip=`${m.metric||''}${m.evidence?'  ·  from '+m.evidence:'  ·  no artifact yet'}`;
  return `<div style="margin:6px 0 2px"><span class="chip ${cls}" title="${String(tip).replace(/"/g,'&quot;')}">${label}</span>`
       + `<span class="chip" title="${m.derived?'derived from a measured artifact':'declared — no artifact answers this yet'}">${measured}</span></div>`;
}

function cycleSVG(labels){
  const pts=[[190,36],[330,176],[50,176]], col=['#3a86c0','#e0863a','#7a6bff'];
  const mid=(a,b)=>[(pts[a][0]+pts[b][0])/2,(pts[a][1]+pts[b][1])/2];
  const line=(a,m)=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${m[0]}" y2="${m[1]}" stroke="#aab4c6" stroke-width="3.5" marker-end="url(#ah)"/>`;
  let s=`<svg viewBox="0 0 380 210" style="width:100%;max-width:440px;height:auto;display:block;margin:8px auto">`;
  s+=`<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a97ad"/></marker></defs>`;
  s+=line(0,mid(0,1))+line(1,mid(1,2))+line(2,mid(2,0));   // A beats B beats C beats A
  labels.slice(0,3).forEach((l,i)=>{const[x,y]=pts[i];
    s+=`<rect x="${x-62}" y="${y-16}" width="124" height="32" rx="16" fill="#fff" stroke="${col[i]}" stroke-width="2.5"/>`+
       `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="800" fill="${col[i]}" font-family="Arial">${l}</text>`;});
  return s+`</svg>`;
}

const MAGDEF={you:'garchomp',ally:'incineroar',foes:['charizard','kingambit'],moves:['earthquake','rockslide','dragonclaw','protect']};
const magPick=(want,i)=>{const L=MAGMONS();return magHas(want)?want:L[i%L.length];};

function roomMagnemite(){const c=CAST.find(x=>x.id==='magnemite');
  if(!window.MAG) return `<div class="panel">${mascotHero(c,"My data bundle is missing.")}</div><div class="panel"><h2>Not built yet</h2><p style="font-weight:600;color:#3a5372">Run <code>node build/build_mag_data.js</code> to generate <code>data/mag.js</code>.</p></div>`;

      <label><input type="checkbox" id="magStall" onchange="magRender()"> I Protected last turn</label>
      <label>Weather <select id="magWX" onchange="magRender()" style="padding:3px"><option value="">none</option><option value="sunnyday">Sun</option><option value="raindance">Rain</option><option value="sandstorm">Sand</option><option value="snowscape">Snow</option></select></label>

  <div class="panel" style="border-color:#8fd0a0;background:#f4fbf6"><h2 style="color:#1f7a3c">Update 2026-07-29 — every click now carries its price</h2>
    <p style="font-weight:600;color:#3a5372">The rollout scorer now <b>subtracts the cost of a click before choosing it</b>: recoil (from the game's own fractions, not a hand list), the toll for touching a Rough Skin body, the 30% burn risk into Flame Body — scaled by how physical the attacker is, zeroed for Fire-types, and <b>inverted for Guts</b>, which actively wants the status. First measured act of the priced scorer: it refused an Iron Head whose 6-HP edge over Air Slash cost a 22-HP Rough Skin toll. It also prices <b>commitment risk against the bench</b>: sun Solar Beam keeps 50% of its value if a benched Pelipper flips the sky, and it names the Pelipper.</p>
    <p style="font-weight:600;color:#3a5372">Strength is measured, not assumed, and the measurement took three runs to come good. Tags-on vs tags-off could not tell the two apart at 29,256 games, and then <b>still could not</b> at 586,816 — a perfect null, 50.0% of decisive pairs, at one-point resolution. Correct mechanics knowledge produced <b>zero</b> strength through the old decision layer. What changed it was refitting the weights on the priced features rather than the blind ones: the twin-test came back <b>51.3%</b> of decisive pairs, and the decisive share <b>tripled</b> (11.9% against 3.4%) — the bots started disagreeing where before the teams decided everything.</p>
    <p style="font-weight:600;color:#3a5372">That result was called <i>promising, not proven</i>, because the edge did not look clearly spread across teams — an edge living in a few matchups is a matchup artifact, not a better player. <b>Confirmed 2026-07-30</b> on an independent seed block: 87,150 games, 43,575 paired, <b>52.3% of decisive pairs (95% CI 50.9–53.6)</b>, and the by-team cut now reads spread — ahead on 337 teams, behind on 248. Honest limits, in the same breath: there is <b>no edge in short games</b> (49.4% under 8 turns), it appears from about turn 8 and grows with length, and the two arms play almost identically at the macro level — protect rate 18.07% against 18.14%, KO rate 17.55% against 17.49%, switches 1.93 either way. The gain is fine-grained choice, not a change of style.</p>
    </div>
  <div class="panel"><h2>What I do not do &mdash; and why not yet</h2>
    <p style="font-weight:600;color:#3a5372">None of these are impossible. They are not done because I shipped the smallest thing that could be honestly measured first, and each one below needs something specific before it can be measured at all.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px">
      <div style="background:#f6f8fb;border:2px solid #e2e8f1;border-radius:12px;padding:11px">
        <div style="font-weight:800;color:#1a2233;margin-bottom:4px">Decide when to switch</div>
        <div style="font-weight:600;color:#3a5372;font-size:12.5px">Currently a coin flip, and the biggest gap: I switch about 8 times a game where people switch 11. Nothing blocks it &mdash; a switch is just one more option to score. What it needs is knowing when a human <i>could</i> have switched and chose not to, which open team sheets give and normal replays do not.</div></div>
      <div style="background:#f6f8fb;border:2px solid #e2e8f1;border-radius:12px;padding:11px">
        <div style="font-weight:800;color:#1a2233;margin-bottom:4px">Run a real damage calculation</div>
        <div style="font-weight:600;color:#3a5372;font-size:12.5px">MEDICHAM already has one, checked against the Smogon calculator. The catch is what a damage number needs. Measured over 85,992 open-sheet entries, a team sheet gives the <b>item, the ability, all four moves and the nature</b> &mdash; but <b>never the stat spread</b>. So even with sheets open, an exact number is not available; how much a Pok&eacute;mon invested in Attack stays hidden. What helps is that Smogon lists spreads <b>by nature</b>, and the sheet tells you the nature, which cuts the plausible spreads for a species from about six to one or two. So this becomes a good estimate rather than a guess &mdash; not an exact figure.</div></div>
      <div style="background:#f6f8fb;border:2px solid #e2e8f1;border-radius:12px;padding:11px">
        <div style="font-weight:800;color:#1a2233;margin-bottom:4px">Guess what you will do</div>
        <div style="font-weight:600;color:#3a5372;font-size:12.5px">I am one turn deep, so I cannot read a Protect or bait a switch. That is a search problem rather than a scoring one, and it is ALAKAZAM's job.</div></div>
    </div></div>`;
}

function magTypeChips(id){ return ((MAG.mons[id]||{}).t||[]).map(t=>`<span style="display:inline-block;color:#fff;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:800;margin-right:3px;background:${MAGTC[t]||'#888'}">${t}</span>`).join(''); }

function magInit(){ if(window.MAG) magOnYou(true); }
function magOnYou(first){
  const y=document.getElementById('magYou').value;
  let def=(first&&y===MAGDEF.you)?MAGDEF.moves.slice():((MAG.mons[y]||{}).mv||[]).slice(0,4);
  def=def.filter(m=>MAG.moves[m]); while(def.length<4) def.push('protect');
  const MOVES=Object.keys(MAG.moves).sort((a,b)=>MAG.moves[a].n.localeCompare(MAG.moves[b].n));
  document.getElementById('magMoves').innerHTML=def.slice(0,4).map((m,i)=>
    `<select id="magMv${i}" onchange="magRender()">${MOVES.map(k=>`<option value="${k}"${k===m?' selected':''}>${MAG.moves[k].n}</option>`).join('')}</select>`).join('');
  magRender();
}

function magRender(){
  const g=id=>document.getElementById(id); if(!g('magYou')) return;
  /* THE ENGINE IS FETCHED ON FIRST USE, so the first render has nothing to score with. Rather than
   * fall back to a second scorer -- which is the whole thing being deleted -- the room says it is
   * loading and re-renders when the engine is in. A failure is shown, never swallowed. */
  if(!MAGENG){
    const box=g('magPick');
    if(MAGENG_ERR){ if(box) box.innerHTML='<div style="background:#fbe6e3;border:2px solid #e8b0a8;border-radius:12px;padding:11px 13px;color:#8c2f22;font-weight:700">Could not load the scorer: '+MAGENG_ERR.message+'</div>'; return; }
    if(box) box.innerHTML='<div style="background:#eef4ff;border:2px solid #cfe0ff;border-radius:12px;padding:11px 13px;color:#6d829b;font-weight:700">loading the real scorer&hellip;</div>';
    magLoadEngine().then(()=>magRender()).catch(()=>magRender());
    return;
  }
  const y=g('magYou').value,a=g('magFA').value,b=g('magFB').value;
  g('magYouImg').src=ani(y); g('magFAImg').src=ani(a); g('magFBImg').src=ani(b);
  g('magYouTypes').innerHTML=magTypeChips(y);
  g('magHPAv').textContent=g('magHPA').value+'%'; g('magHPBv').textContent=g('magHPB').value+'%';
  const foes=[{id:a,hp:+g('magHPA').value/100,status:g('magStA').checked?'par':''},
              {id:b,hp:+g('magHPB').value/100,status:g('magStB').checked?'par':''}];
  const board={side:{tailwind:g('magTW').checked},field:{trickroom:g('magTR').checked},
               weather:g('magWX').value,stalled:g('magStall').checked};
  const user={id:y};
  const allyId=g('magAlly')?g('magAlly').value:null;
  const ally=allyId?[{id:allyId,hp:1,status:''}]:[];
  if(g('magAllyImg')&&allyId) g('magAllyImg').src=ani(allyId);
  const ids=[0,1,2,3].map(i=>g('magMv'+i)?g('magMv'+i).value:null).filter(Boolean);
  /* CANDIDATES AND VECTORS COME FROM THE ENGINE, not from a list built here. board.js decides what is
   * clickable — including the choice-lock rule and every targeting shape — and scores it. This room's
   * only job is to put a label on each one. */
  const st={you:y,a:a,b:b,allyId:allyId,
            hpA:+g('magHPA').value/100, hpB:+g('magHPB').value/100,
            stA:g('magStA').checked, stB:g('magStB').checked,
            weather:g('magWX').value, trickroom:g('magTR').checked,
            tailwind:g('magTW').checked, stalled:g('magStall').checked, moves:ids};
  const bs=MAGENG.B.baseSpecies;
  const cands=magScore(st).filter(o=>o.cand.move).map(o=>{
    const id=o.cand.move.id, m=MAG.moves[id]||{n:o.cand.move.name};
    const label = o.cand.spread ? (o.cand.allies?'everything':'both foes')
                : o.cand.targetMon ? ((MAG.mons[bs(o.cand.targetMon.species)]||{}).n||o.cand.targetMon.species)
                : 'itself';
    return {id,m,label,x:o.x};
  });
  for(const c of cands) c.s=magDot(c.x);
  const mx=Math.max(...cands.map(c=>c.s)); let z=0;
  for(const c of cands){ c.e=Math.exp(c.s-mx); z+=c.e; } for(const c of cands) c.p=c.e/z;
  const rows=cands.slice().sort((p,q)=>q.s-p.s);
  window.__magRows=rows;
  const top=rows[0];
  g('magPick').innerHTML=`<div style="background:#eef4ff;border:2px solid #cfe0ff;border-radius:12px;padding:11px 13px;margin-bottom:11px">
      <div style="font-size:11px;font-weight:800;color:#6d829b;text-transform:uppercase;letter-spacing:.5px">I would click</div>
      <div style="font-size:19px;font-weight:900;color:#1a2233;margin:2px 0 3px">${top.m.n} <span style="color:#6d829b;font-weight:700;font-size:15px">at ${top.label}</span></div>
      <div style="font-size:12.5px;color:#6d829b;font-weight:700">score ${magNum(top.s)} &mdash; the best of ${rows.length} options. I still roll dice, so I take it about ${(100*top.p).toFixed(0)}% of the time rather than always.</div></div>`;
  g('magA').innerHTML=magTable(rows);
  g('magW').innerHTML=magWeights();
}

const magNum=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(2);

function magWhy(c){
  const x=c.x,t=[]; const tag=(cls,txt)=>`<span style="display:inline-block;border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:800;margin:0 4px 3px 0;white-space:nowrap;${cls}">${txt}</span>`;
  const G='background:#e3f4e9;color:#1f8a4c', B='background:#fbe6e3;color:#b03a2e', N='background:#eef1f6;color:#6b7691', W='background:#fdf3dd;color:#c08a1a';
  if(x[MAGIX.immune]) t.push(tag(B,'does nothing at all'));
  else if(x[MAGIX.eff4]>0) t.push(tag(G,'4&times; damage'));
  else if(x[MAGIX.eff2]>0) t.push(tag(G,'2&times; damage'));
  else if(x[MAGIX.effQuarter]>0) t.push(tag(B,'&frac14; damage'));
  else if(x[MAGIX.effHalf]>0) t.push(tag(B,'half damage'));
  if(x[MAGIX.allyHit]) t.push(tag(W,'hits my own partner'));
  if(x[MAGIX.deadSide]||x[MAGIX.deadField]) t.push(tag(B,'already up &mdash; would fail'));
  if(x[MAGIX.deadWeather]) t.push(tag(B,'weather already set'));
  if(x[MAGIX.deadStatus]) t.push(tag(B,'already statused'));
  if(x[MAGIX.deadStall]) t.push(tag(W,'protected last turn'));
  if(x[MAGIX.stab]) t.push(tag(N,'same type as me'));
  if(x[MAGIX.tgtHurt]>0.5) t.push(tag(G,'target is hurt'));
  if(!t.length) t.push(tag(N,'nothing special'));
  return t.join('');
}

/* THE SCORE IS THE OUTPUT AND IT GETS ITS OWN COLUMN. Showing only the percentage hid the thing the
   model actually computes, and made near-equal options look arbitrary. Each row opens to reveal the
   sum that produced it. */
function magTable(rows){
  const th=(t,al)=>`<th style="text-align:${al||'left'};font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#6d829b;padding:0 8px 6px;font-weight:800">${t}</th>`;
  const lo=Math.min(...rows.map(r=>r.s)), hi=Math.max(...rows.map(r=>r.s)), span=(hi-lo)||1;
  return `<table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead><tr>${th('move')}${th('at')}${th('score','right')}${th('how often I take it')}${th('why')}</tr></thead><tbody>`+
    rows.map((c,i)=>`
    <tr onclick="magExplain(${i})" style="cursor:pointer;${i===0?'background:#eef4ff;':''}" title="click for the arithmetic">
      <td style="padding:6px 8px;border-top:1px solid #eef1f6;font-weight:800;white-space:nowrap"><span style="color:#9fb0c6;font-size:10px">&#9662;</span> ${c.m.n}</td>
      <td style="padding:6px 8px;border-top:1px solid #eef1f6;font-size:12px;color:#6b7691;white-space:nowrap">${c.label}</td>
      <td style="padding:6px 8px;border-top:1px solid #eef1f6;text-align:right;font-family:ui-monospace,Menlo,monospace;font-weight:800;white-space:nowrap;color:${c.s>=0?'#2f5fc0':'#b03a2e'}">${magNum(c.s)}</td>
      <td style="padding:6px 8px;border-top:1px solid #eef1f6;white-space:nowrap"><b style="display:inline-block;width:34px">${(100*c.p).toFixed(0)}%</b>
        <span style="display:inline-block;width:60px;height:9px;border-radius:5px;background:#e6eaf2;overflow:hidden;vertical-align:middle"><i style="display:block;height:100%;width:${Math.round(100*(c.s-lo)/span)}%;background:linear-gradient(90deg,#5f8ee0,#2f5fc0)"></i></span></td>
      <td style="padding:6px 8px;border-top:1px solid #eef1f6">${magWhy(c)}</td>
    </tr>
    <tr id="magX-${i}" style="display:none"><td colspan="5" style="padding:0 8px 12px;background:#f8fafd"></td></tr>`).join('')+
    `</tbody></table>
    <div style="font-size:11.5px;color:#6b7691;margin-top:8px">Click a row for the sum behind its score. The percentages follow from the scores: one point of score is worth about <b>2.7&times;</b> the chance of being picked.</div>`;
}

const MAGLABEL={fasterThanTarget:'I move before the target',tgtPhysical:'the target is a physical attacker',defMismatch:'I hit its softer defence',tgtBulk:'the target is bulky',abilityBlock:'an ability would eat it',eff4:'it hits a 4&times; weakness',eff2:'it hits a 2&times; weakness',
  effHalf:'it is resisted',effQuarter:'it is resisted twice over',
  allyHit:'it also hits my own partner',immune:'it does nothing at all',stab:'it matches my own type',
  bp:'it is a powerful move',isStatus:'it is a status move',tgtHurt:'the target is already hurt',
  deadStatus:'the target already has a status',deadSide:'that side effect is already up',
  deadField:'that field effect is already up',deadWeather:'that weather is already set',
  deadStall:'I protected last turn',priorLogP:'it is a popular move'};

/* The arithmetic behind one score, in full. Terms worth nothing on this board are left out rather
   than padding the list with zeroes. */
function magExplain(i){
  const rows=window.__magRows; if(!rows||!rows[i]) return;
  const c=rows[i], tr=document.getElementById('magX-'+i); if(!tr) return;
  if(tr.style.display!=='none'){ tr.style.display='none'; return; }
  const terms=MAGF.map((f,k)=>({f,v:c.x[k],w:MAG.weights[k],c:c.x[k]*MAG.weights[k]}))
                  .filter(t=>Math.abs(t.c)>1e-9).sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
  const cell=(t,extra)=>`<td style="padding:3px 8px;${extra||''}">${t}</td>`;
  tr.querySelector('td').innerHTML=
    `<div style="font-weight:800;margin:10px 0 7px;color:#3a5372">${c.m.n} at ${c.label} &mdash; where the score comes from</div>
     <table style="width:100%;border-collapse:collapse;font-size:12.5px">
     <thead><tr>
       <th style="text-align:left;padding:0 8px 5px;font-size:10.5px;color:#6d829b;text-transform:uppercase;letter-spacing:.5px">what I can see</th>
       <th style="text-align:right;padding:0 8px 5px;font-size:10.5px;color:#6d829b;text-transform:uppercase;letter-spacing:.5px">on this board</th>
       <th style="text-align:right;padding:0 8px 5px;font-size:10.5px;color:#6d829b;text-transform:uppercase;letter-spacing:.5px">how much it counts</th>
       <th style="text-align:right;padding:0 8px 5px;font-size:10.5px;color:#6d829b;text-transform:uppercase;letter-spacing:.5px">adds</th>
     </tr></thead><tbody>`+terms.map(t=>`<tr>
       ${cell(MAGLABEL[t.f]||t.f,'font-weight:700')}
       ${cell(magNum(t.v),'text-align:right;font-family:ui-monospace,Menlo,monospace;color:#6b7691')}
       ${cell(magNum(t.w),'text-align:right;font-family:ui-monospace,Menlo,monospace;color:#6b7691')}
       ${cell(magNum(t.c),`text-align:right;font-family:ui-monospace,Menlo,monospace;font-weight:800;color:${t.c>=0?'#2f5fc0':'#b03a2e'}`)}
     </tr>`).join('')+
     `<tr><td colspan="3" style="padding:7px 8px 3px;text-align:right;border-top:2px solid #dde3ec;font-weight:800">total score</td>
      <td style="padding:7px 8px 3px;text-align:right;border-top:2px solid #dde3ec;font-family:ui-monospace,Menlo,monospace;font-weight:800;color:${c.s>=0?'#2f5fc0':'#b03a2e'}">${magNum(c.s)}</td></tr>
     </tbody></table>
     <div style="font-size:11.5px;color:#6b7691;margin-top:7px">Multiply the middle two columns and add up the right one. "How much it counts" was fitted from real games and is the same on every board; "on this board" is what changes.</div>`;
  tr.style.display='';

/* A DIVERGING chart, centred on "makes no difference".

   "pushes away from" read as an error rather than as the bot correctly refusing a dead move — and a
   weight of +0.03 rendered as an invisible sliver captioned "pulls toward", which says the opposite

   too small to matter says so in words instead of drawing a stub. */
function magWeights(){
  /* WEIGHT ALONE IS THE WRONG THING TO PLOT, AND THE FIRST VERSION PLOTTED IT.
     The score is a sum of (what I see) x (how much it counts). Those two numbers are only
     comparable across rows if the first one is on the same scale everywhere, and it is not: most
     features are 0-or-1 flags, but "hits a weakness" runs about -4..+2 and "how popular the move
     is" runs about -7.6..0. So a small weight on a wide-ranging feature can move a score more than
     a big weight on a flag that is usually 0.

     weight x how much that feature varies. data/policy-weights.json carries the variation measured
     over the whole fitting corpus; without it we fall back to the raw weight and say so. */
  const sd=(MAG.spread&&MAG.spread.length===MAGF.length)?MAG.spread:null;
  const rows=MAGF.map((f,i)=>({f,w:MAG.weights[i],infl:MAG.weights[i]*(sd?sd[i]:1)}))
                 .sort((a,b)=>a.infl-b.infl);
  const MAXI=Math.max(...rows.map(r=>Math.abs(r.infl)))||1;
  const strength=r=>{const m=Math.abs(r.infl)/MAXI;
    if(m<0.06) return 'barely counts';
    return (m>0.6?'strongly ':(m>0.25?'':'slightly '))+(r.infl<0?'puts me off':'draws me in');};

     color:#6d829b;text-transform:uppercase;letter-spacing:.5px;margin:0 0 7px">
     <span>&larr; puts me off the move</span><span>draws me to it &rarr;</span></div>
   <table style="width:100%;border-collapse:collapse;font-size:13px"><tbody>`+

    const bar=tiny?`<span style="position:absolute;left:calc(50% - 1px);top:2px;width:3px;height:10px;border-radius:2px;background:#c3cbd8"></span>`
      :`<span style="position:absolute;top:2px;height:10px;border-radius:3px;${neg?`right:50%;width:${half}%;background:linear-gradient(270deg,#d9776b,#b03a2e)`:`left:50%;width:${half}%;background:linear-gradient(90deg,#5f8ee0,#2f5fc0)`}"></span>`;
    return `<tr>
      <td style="padding:5px 10px 5px 0;border-top:1px solid #eef1f6;font-weight:700;white-space:nowrap">${MAGLABEL[r.f]||r.f}</td>
      <td style="padding:5px 0;border-top:1px solid #eef1f6;width:55%">
        <span style="position:relative;display:block;height:14px;background:#f2f5f9;border-radius:3px">
          <span style="position:absolute;left:50%;top:-1px;width:1px;height:16px;background:#cdd5e2"></span>${bar}
        </span></td>
      <td style="padding:5px 0 5px 12px;border-top:1px solid #eef1f6;font-size:11.5px;color:#6b7691;white-space:nowrap">${strength(r)}</td>
    </tr>`;}).join('')+
   `</tbody></table>
    <p style="font-weight:600;color:#3a5372;margin:11px 0 0;font-size:13px">
      Bar length is how much each thing actually <b>swings a score</b> in real games &mdash; not the raw
      number it is multiplied by. Both direction and size matter: the score is a sum, so something
      twice as long moves the answer twice as far.${sd?'':' <b>(Raw weights shown &mdash; refit to measure the swing.)</b>'}</p>
      <p style="font-weight:600;color:#3a5372;margin:8px 0 0;font-size:13px">Two different questions, and they
      have different answers. <b>Per turn</b>, hitting a weakness is what moves me most, because it is
      different on every board. <b>When it fires</b>, "this move cannot work" is far stronger &mdash; a dead
      move is hit about five times harder than a weakness is rewarded &mdash; but it is rare, so it
      swings less overall. The bars above show the second thing.</p>`;
}

/* Hover = unmistakable. Everything unrelated drops to near-invisible; edges INTO the model are
   green (what it reads), edges OUT are orange (who reads it), and the caption spells out both
   directions in words instead of making you trace lines. */
function mapHi(id){
  const IN='#2e9e63', OUT='#e08a2e';
  const lines=[...document.querySelectorAll('#abramap .edge')];
  const nameOf=n=>{const g=document.querySelector('#abramap g.node[data-id="'+n+'"]');return g?(g.dataset.nm||n):n;};
  const feeders=[], readers=[];
  lines.forEach(l=>{
    const into = id && l.dataset.to===id, outof = id && l.dataset.from===id;
    if(into) feeders.push(l.dataset.from); if(outof) readers.push(l.dataset.to);
    l.setAttribute('stroke', into?IN:(outof?OUT:'#c7cede'));
    l.setAttribute('stroke-width', (into||outof)?'4.5':'1.6');
    l.setAttribute('opacity', id?((into||outof)?'1':'0.06'):'0.7');
    l.setAttribute('marker-end', (into||outof)?(into?'url(#mhIn)':'url(#mhOut)'):'url(#mh)');
  });
  document.querySelectorAll('#abramap g.node').forEach(g=>{ const nid=g.dataset.id;
    const box=g.querySelector('rect');
    if(!id){ g.style.opacity=1; if(box){box.setAttribute('stroke-width','2.5'); if(box.dataset.br)box.setAttribute('stroke',box.dataset.br);} return; }
    const isSelf=nid===id, isFeed=feeders.includes(nid), isRead=readers.includes(nid);
    g.style.opacity=(isSelf||isFeed||isRead)?1:0.08;
    if(box) box.setAttribute('stroke-width', isSelf?'5':(isFeed||isRead)?'3.5':'2.5');
    if(box&&(isFeed||isRead)) box.setAttribute('stroke', isFeed?IN:OUT);
    else if(box&&box.dataset.br) box.setAttribute('stroke', box.dataset.br);
  });
  const tip=document.getElementById('maptip');
  if(!tip) return;
  if(!id){ tip.innerHTML='<b>Hover any model</b> — it lights up what feeds it and what it feeds.'; return; }
  const g2=document.querySelector('#abramap g.node[data-id="'+id+'"]'); if(!g2) return;
  const me=g2.dataset.nm||id;
  const f=feeders.length?feeders.map(nameOf).join(', '):'every public Pok\u00e9mon Showdown replay';
  const r=readers.length?readers.map(nameOf).join(', '):'<b>you</b> \u2014 this one is a finished tool you use directly';
  tip.innerHTML=`<b style="font-size:15px">${me}</b> — ${g2.dataset.plain||''}<br>`+
    `<span style="color:${IN};font-weight:800">▸ reads from:</span> ${f}<br>`+
    `<span style="color:${OUT};font-weight:800">▸ feeds into:</span> ${r}`;
}

// parse a Showdown battle log into KADABRA scenes at the turns where a KO happened
function kadBuild(log, meName){
  const L=log.split('\n'); const P={p1:'',p2:''};
  const cur={p1a:null,p1b:null,p2a:null,p2b:null};
  const nm=(meName||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const pct=s=>{ if(!s)return 0; if(/fnt/.test(s)||/^0\b/.test(s))return 0; const m=String(s).match(/(\d+)\/(\d+)/); if(m)return Math.max(0,Math.round(100*(+m[1])/(+m[2]))); const n=parseInt(s); return isNaN(n)?100:n; };
  const stf=s=>{ const m=String(s||'').match(/\b(brn|par|slp|psn|tox|frz)\b/); return m?m[1]:''; };
  const slotOf=x=>String(x).split(':')[0].trim();
  const setSlot=(slot,species,hpstr)=>{ cur[slot]={sp:spriteName(species).sprite, hp:pct(hpstr), st:stf(hpstr), name:species}; };
  const cleanN=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const meSide=()=> (nm && cleanN(P.p2).includes(nm) && !cleanN(P.p1).includes(nm)) ? 'p2':'p1';
  let turn=0, faints=[], tlog=[]; const scenes=[]; let result='(unfinished)';
  const cf={p1:0,p2:0};                        // cumulative faints per side (bring-4) for PORY win%
  const flush=()=>{ if(!faints.length)return; const side=meSide(), foeS=side==='p1'?'p2':'p1';
    const you=[cur[side+'a'],cur[side+'b']].filter(Boolean).map(m=>({sp:m.sp,hp:m.hp,st:m.st}));
    const foe=[cur[foeS+'a'],cur[foeS+'b']].filter(Boolean).map(m=>({sp:m.sp,hp:m.hp,st:m.st}));
    const mine=faints.filter(f=>f.slot.startsWith(side)).map(f=>cap(f.name));
    const theirs=faints.filter(f=>f.slot.startsWith(foeS)).map(f=>cap(f.name));
    // PORY: win% from this board (mons alive out of 4 + mean active HP + turn)
    const myAct=[cur[side+'a'],cur[side+'b']].filter(m=>m&&m.hp>0), foeAct=[cur[foeS+'a'],cur[foeS+'b']].filter(m=>m&&m.hp>0);
    const myHp=myAct.length?myAct.reduce((s,m)=>s+m.hp,0)/myAct.length:0, foeHp=foeAct.length?foeAct.reduce((s,m)=>s+m.hp,0)/foeAct.length:0;

    let kind='good', coach='';
    if(mine.length){ kind='loss'; coach=`Protect or pivot ${mine.join(' & ')} out here instead of leaving ${mine.length>1?'them':'it'} in. You traded ${mine.length>1?'two Pokémon':'a Pokémon'} for nothing on turn ${turn} — that's the swing. Keeping ${mine.length>1?'them':'it'} alive (Protect, a switch, or a different lead) flips the game from here.`; }
    else if(theirs.length){ kind='good'; coach=`Good — you KO'd ${theirs.join(' & ')} and you're up a body. Keep the pressure: bring your win condition in safely and don't hand the tempo back.`; }
    scenes.push({n:turn, you, foe, log:tlog.slice(-4), kind, coach, key:true, _loss:mine.length, wp});
  };
  for(const ln of L){ if(ln[0]!=='|')continue; const p=ln.split('|'); const t=p[1];
    if(t==='player'){ if(p[2]==='p1')P.p1=p[3]||''; if(p[2]==='p2')P.p2=p[3]||''; }
    else if(t==='switch'||t==='drag'||t==='replace'){ setSlot(slotOf(p[2]),(p[3]||'').split(',')[0],p[4]||'100/100'); }
    else if(t==='-damage'||t==='-sethp'){ const s=slotOf(p[2]); if(cur[s]){cur[s].hp=pct(p[3]); const st=stf(p[3]); if(st)cur[s].st=st;} }
    else if(t==='-heal'){ const s=slotOf(p[2]); if(cur[s])cur[s].hp=pct(p[3]); }
    else if(t==='-status'){ const s=slotOf(p[2]); if(cur[s])cur[s].st=p[3]; }
    else if(t==='move'){ const s=slotOf(p[2]); const who=cur[s]?cap(cur[s].name):''; if(who)tlog.push(`${who} used ${p[3]}.`); }
    else if(t==='faint'){ const s=slotOf(p[2]); if(cur[s]){faints.push({slot:s,name:cur[s].name}); if(cf[s.slice(0,2)]!=null)cf[s.slice(0,2)]++; tlog.push(`${cap(cur[s].name)} fainted.`); cur[s].hp=0;} }
    else if(t==='turn'){ flush(); faints=[]; tlog=[]; turn=(+p[2])||turn+1; }
    else if(t==='win'){ result=(p[2]||'').trim(); flush(); }
    else if(t==='tie'){ result='tie'; flush(); }

  return { me:meN||'You', foe:foeN||'Opponent', result: result==='(unfinished)'?'—':(win?'Win':'Loss'), scenes: sc };
}

/* PORY — mid-game win% value net (data/pory.js). Feature order matches engine/pory.py:

function poryWin(myAlive,foeAlive,myHp,foeHp,turn){
  const P=window.PORY; if(!P||!P.weights) return null;

  let lin=P.weights[0];
  for(let i=0;i<5;i++){ const z=(raw[i]-P.mean[i])/P.std[i]; lin+=P.weights[i+1]*z; }
  return Math.round(100/(1+Math.exp(-lin)));

      <div style="display:flex;gap:8px;align-items:center">${dots}</div>
      <button class="battlebtn" style="padding:10px 20px;font-size:16px" onclick="kadNav(1)" ${kadI===kadKeys.length-1?'disabled style="opacity:.4;padding:10px 20px;font-size:16px"':''}>next →</button>
    </div>
    <div style="text-align:center;margin-top:8px"><a href="https://replay.pokemonshowdown.com/${KAD.id}?turn=${s.n}" target="_blank" rel="noopener" style="font-size:12px;color:#99a">watch this turn on Showdown ↗</a></div>`;
}

/* ===== PokePaste support — accepts ANY species ===== */
function spriteName(raw){
  let s=(raw||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const forms=['alola','galar','hisui','paldea','therian','incarnate','eternal','origin','wash','heat',
    'frost','mow','fan','dusk','midnight','bloodmoon','rapidstrike','singlestrike','crowned','hero','ice'];
  for(const f of forms){ if(s.endsWith(f)&&s.length>f.length+2) return {n:s,sprite:s.slice(0,-f.length)+'-'+f}; }
  return {n:s,sprite:s};
}
function parsePaste(text){
  const names=[];
  (text||'').split(/\n\s*\n/).forEach(block=>{
    const first=(block.trim().split('\n')[0]||'').trim(); if(!first) return;
    let name=first.split('@')[0].trim();
    const paren=first.match(/\(([^)]+)\)/);
    if(paren && !/^[MF]$/i.test(paren[1])) name=paren[1].trim();   // Nick (Species) @ item
    name=name.replace(/\((M|F)\)/gi,'').trim();
    if(name && !/^Ability:|^Level:|^EVs:|^IVs:|^Tera|^-/i.test(name)) names.push(name);
  });
  return names.slice(0,6);
}
function loadPaste(side){
  const raw=parsePaste(document.getElementById('paste'+side).value);
  const team=[]; let off=0;
  raw.forEach(r=>{ const {n,sprite}=spriteName(r); if(!n) return;
    if(!BY[n]){ BY[n]={n,sprite,w:0,spd:0.5,fire:0.5,bring:0,off:true}; off++; }
    else if(BY[n].off) off++;
    team.push(n); });
  if(side==='A') teamA=team; else teamB=team;
  renderSlots(); syncSel();
  const r=document.getElementById('readout');
  r.innerHTML = team.length ? `Loaded ${team.length} into ${side==='A'?' your':' rival'} team`+
    (off?` — <b>${off}</b> not yet in JOLTEON's vocabulary, so they're treated as neutral until the ladder feeds it more games.`:' ')+' Press BATTLE! '
    : 'No Pokémon found in that paste — check the format.';
}

/* gently teleporting Abras in the background  */

/* SHINY ODDS — 1/4096, the base rate from Gen 6 onward.
 *
 * ROLLED PER TELEPORT, so every blink-in is its own encounter, exactly as an encounter is a roll in
 * game. Five sprites teleporting roughly every four seconds is ~4,500 rolls an hour, which works out
 * at about a 2-in-3 chance of finding one if the page is left open for an hour. That is deliberate:
 * it makes it a hunt you can actually complete rather than a number nobody ever sees.
 *
 * Once found it STAYS shiny — the sprite keeps it for the rest of the session, so you can watch the
 * one you caught. */
const SHINY_ODDS = 4096;

function makeAbra(){   /* roaming teleporting Abra sprites in the side margins */
  const a=document.createElement('img'); a.className='tp'; a.src=ani('abra'); document.body.appendChild(a);
  let shiny=false;
  const roll=()=>{
    if(shiny) return;                                    // already found: keep it
    if(Math.floor(Math.random()*SHINY_ODDS)!==0) return;
    shiny=true;
    a.src=ani('abra',true);
    a.classList.add('shiny');
    a.title='Shiny Abra — 1 in '+SHINY_ODDS.toLocaleString();
  };
  /* Pick a spot that is inside the viewport, outside the content column, and not on top of another
   * Abra. The previous version used raw vw/vh percentages, which had three problems: a sprite placed
   * at 98vw hung off the right edge because its own 52px width was never subtracted; the margins
   * were assumed rather than measured, so a narrow window put Abras over the text; and nothing
   * stopped two of them landing in the same place.
   *
   * Measured against the real content box, so it adapts to the window instead of guessing. */
  const slot = { x: -999, y: -999 };
  ABRAS.push(slot);
  const place = () => {
    const S = 52, PAD = 12, EDGE = 8;
    const W = window.innerWidth, H = window.innerHeight;
    // the actual content column, measured — not a hardcoded percentage
    const main = document.querySelector('.wrap, main, #app, .container') || document.body;
    const box = main.getBoundingClientRect();
    const leftLimit = Math.max(EDGE, Math.min(box.left, W) - S - PAD);   // right edge of the left margin
    const rightStart = Math.min(W - S - EDGE, Math.max(0, box.right) + PAD);
    const leftUsable = leftLimit > EDGE, rightUsable = rightStart < W - S - EDGE;
    if (!leftUsable && !rightUsable) return;                            // no room: stay put

    for (let t = 0; t < 40; t++) {
      const goRight = rightUsable && (!leftUsable || Math.random() < 0.5);
      const x = goRight
        ? rightStart + Math.random() * Math.max(1, (W - S - EDGE) - rightStart)
        : EDGE + Math.random() * Math.max(1, leftLimit - EDGE);
      const y = H * 0.12 + Math.random() * Math.max(1, H * 0.76 - S);
      const cx = Math.min(Math.max(x, EDGE), W - S - EDGE);             // never past a wall
      const cy = Math.min(Math.max(y, EDGE), H - S - EDGE);
      const clash = ABRAS.some(o => o !== slot &&
        Math.abs(o.x - cx) < S + PAD && Math.abs(o.y - cy) < S + PAD);
      if (clash) continue;
      slot.x = cx; slot.y = cy;
      a.style.left = cx + 'px'; a.style.top = cy + 'px';
      return;
    }
    // 40 failures means the margins are genuinely full — keep the current spot rather than overlap
  };
  const ring=()=>{ const r=document.createElement('div'); r.className=shiny?'tpring shinyring':'tpring'; r.style.left=a.style.left; r.style.top=a.style.top;
    document.body.appendChild(r); setTimeout(()=>r.remove(),shiny?1600:700); };
  place();
  const loop=()=>{
    a.classList.remove('in'); a.classList.add('out');            // teleport out
    setTimeout(()=>{ place(); roll(); a.classList.remove('out'); a.classList.add('in'); ring(); }, 500);  // blink in elsewhere
    setTimeout(loop, 2600+Math.random()*3400);
  };
  setTimeout(()=>{ roll(); a.classList.add('in'); ring(); loop(); }, Math.random()*2600);
}
/* Live positions, so each Abra can avoid the others. */
const ABRAS = [];
for(let i=0;i<5;i++) makeAbra();
/* A resize can leave a sprite outside the new viewport or over the content; re-place them all. */
let _abraResize=null;
window.addEventListener('resize',()=>{ clearTimeout(_abraResize);
  _abraResize=setTimeout(()=>document.querySelectorAll('.tp').forEach(el=>{
    const S=52,E=8,W=window.innerWidth,H=window.innerHeight;
    el.style.left=Math.min(Math.max(parseFloat(el.style.left)||E,E),W-S-E)+'px';
    el.style.top =Math.min(Math.max(parseFloat(el.style.top )||E,E),H-S-E)+'px';
  }),150); });

const cvs=document.getElementById('confetti'),ctx=cvs.getContext('2d');
function fit(){cvs.width=innerWidth;cvs.height=innerHeight;}fit();addEventListener('resize',fit);
let parts=[];
function burst(good){const cols=good?['#ffd23f','#5fd07a','#4fb0ff','#ff6bd6']:['#ff6b57','#ff9bbb','#ffd23f'];
  for(let i=0;i<120;i++)parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,
    c:cols[i%cols.length],r:4+Math.random()*5,a:1,rot:Math.random()*6}); requestAnimationFrame(tick);}
function tick(){ctx.clearRect(0,0,cvs.width,cvs.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a-=.012;p.rot+=.2;
  ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);ctx.restore();});
  parts=parts.filter(p=>p.a>0&&p.y<innerHeight+20); if(parts.length) requestAnimationFrame(tick);}
